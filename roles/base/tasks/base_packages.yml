---
- set_fact:
    base_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
      - virtualenv
      - python3-setuptools
      - procps
      - file
      - git
      - jq  # not Debian
      - yq
      - nano
      - xauth  # for ssh X11 forwarding
      - fzf
      - htop
      - code

- name: install dnf5 python library
  shell:
    cmd: "dnf install -y dnf5 python3-libdnf5"
    creates: /usr/share/licenses/python3-libdnf5

- name: add microsoft repository
  copy:
    src: files/vscode.repo
    dest: /etc/yum.repos.d/vscode.repo
    owner: root
    group: root
    mode: "0644"

- name: upgrade packages
  dnf:
    update_cache: true
    update_only: true
    autoremove: true

- name: install required packages
  dnf:
    name: "{{ base_packages }}"
    state: latest
    update_cache: false
