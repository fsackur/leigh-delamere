---

#
# WARNING: this will prompt on the desktop.
# If you are not logged in, it will time out.
#

- name: test {{ extension.name }} path for {{ _user }}
  stat:
    path: /home/{{ _user }}/.local/share/gnome-shell/extensions/{{ extension.id }}
  register: extension_folder

- when: not extension_folder.stat.exists
  block:
    - include_tasks:
        file: prompt_interactive_session.yml
      vars:
        interactive_user: "{{ _user }}"

    - when: not logged_in_interactively[_user]
      fail:
        msg: "Cannot install gnome shell extension: {{ _user }} is not logged in interactively."

    - when: logged_in_interactively[_user]
      fail:
        msg: "Click on the installation prompt in {{ _user }}'s desktop session..."
      ignore_errors: true

    - name: install {{ extension.name }}
      shell:
        cmd: busctl --machine={{ _user }}@.host --user call org.gnome.Shell /org/gnome/Shell org.gnome.Shell.Extensions InstallRemoteExtension s {{ extension.id }}
        creates: /home/{{ _user }}/.local/share/gnome-shell/extensions/{{ extension.id }}
